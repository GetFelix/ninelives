name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install actionlint
        # Pinned by hash so a changed release asset fails the job instead of running (S21).
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" actionlint
      - name: actionlint
        run: ./actionlint -color
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scripts compile
        run: python3 -m compileall -q scripts site/scripts
      - name: Unit tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Kernel pin and fragments
        run: |
          # Against the target branch: no downgrade, and kernel/keys/ never
          # changes in the same pull request as kernel/VERSION.
          args=()
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git fetch -q --depth=1 origin "$GITHUB_BASE_REF"
            base=$RUNNER_TEMP/base
            mkdir -p "$base"
            if git cat-file -e FETCH_HEAD:kernel/VERSION 2>/dev/null; then
              git archive FETCH_HEAD kernel | tar -x -C "$base"
              args=(--base "$base/kernel")
            fi
          fi
          python3 -I scripts/fetch_kernel.py --check "${args[@]}"
          python3 -I scripts/check_kernel_config.py lint
      - name: Component manifest
        run: |
          args=()
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git fetch -q --depth=1 origin "$GITHUB_BASE_REF"
            if git show FETCH_HEAD:images/components.toml > "$RUNNER_TEMP/base.toml" 2>/dev/null; then
              args=(--base "$RUNNER_TEMP/base.toml")
            fi
          fi
          python3 scripts/check_components.py "${args[@]}"
      - name: Image pins
        run: python3 -I scripts/image_lock.py check

  init:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: init
    env:
      CARGO_TERM_COLOR: always
      # The PID 1 tests run the init in its own namespaces through sudo; set
      # here so they fail instead of skipping.
      NL_INIT_ROOT_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: unsafe only in mod sys (0005)
        working-directory: .
        run: |
          python3 scripts/check_unsafe.py --self-test
          python3 scripts/check_unsafe.py init
      - name: Toolchain
        # Installs the version rust-toolchain.toml pins.
        run: rustup toolchain install
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked
      - name: Install cargo-deny
        # Pinned by hash so a changed release asset fails the job instead of running (S21).
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSLo "$RUNNER_TEMP/$name.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP" "$name/cargo-deny"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: cargo deny
        run: cargo deny --locked check

  # The kernel and image jobs take several minutes, so a pull request runs
  # them only when it touches what they check. Pushes to main always run them.
  kernel-changes:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.diff.outputs.run }}
      epoch: ${{ steps.diff.outputs.epoch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        run: |
          run=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # The checkout is the merge commit; its first parent is the base.
            if ! git diff --name-only HEAD^1 HEAD \
              | grep -qE '^(kernel/|images/|rootfs/|init/|tools/(image|boot)\.sh$|scripts/(bootstrap\.sh|check_kernel_config\.py|fetch_kernel\.py|kernel_build\.sh|image[-_a-z]*\.(py|sh)|boot[-_a-z]*\.(py|sh)|fetch_image\.py|check_image\.py|faketime(_lib\.py|\.sh))$|\.github/workflows/ci\.yml$)'; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          # The image's timestamp: the commit time of the commit checked out,
          # which is github.sha. The image container has no git to ask.
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

  kernel:
    needs: kernel-changes
    if: needs.kernel-changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: arch/x86/boot/bzImage
          - arch: aarch64
            image: arch/arm64/boot/Image
    runs-on: ubuntu-24.04
    # Debian 13 by digest, with packages from one snapshot, so the compiler
    # (and with it the resolved config) changes only in a reviewed commit.
    # No caches anywhere: this output feeds the image (S5, S21).
    container:
      image: debian@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2 # trixie-20261104-slim
    env:
      DEBIAN_SNAPSHOT: 20261118T000000Z
      # kernel-hardening-checker v0.6.17.1, by commit (S21).
      KHC_COMMIT: afc376f2a935994793343cfeb05953583cc30191
      WORK: /__w/_temp/kernel
    steps:
      - name: Toolchain from the pinned snapshot
        run: |
          # apt checks the snapshot's Release files against the image's own
          # Debian archive keyring, so plain http is enough.
          keyring=$(sed -n 's/^Signed-By: //p' /etc/apt/sources.list.d/debian.sources | head -n1)
          test -s "$keyring"
          rm /etc/apt/sources.list.d/debian.sources
          cat > /etc/apt/sources.list.d/snapshot.sources <<EOF
          Types: deb
          URIs: http://snapshot.debian.org/archive/debian/${DEBIAN_SNAPSHOT}
          Suites: trixie trixie-updates
          Components: main
          Signed-By: ${keyring}

          Types: deb
          URIs: http://snapshot.debian.org/archive/debian-security/${DEBIAN_SNAPSHOT}
          Suites: trixie-security
          Components: main
          Signed-By: ${keyring}
          EOF
          apt-get -o Acquire::Check-Valid-Until=false -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            bc bison ca-certificates clang flex git gpgv libc6-dev libelf-dev lld llvm make python3 xz-utils
          clang --version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify the tarball and resolve the config
        id: resolve
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/kernel_build.sh resolve "${{ matrix.arch }}" "$WORK"
          cp "$WORK/out/.config" "$WORK/qemu-${{ matrix.arch }}.config"
      - name: Upload the resolved config
        if: always() && steps.resolve.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-config-qemu-${{ matrix.arch }}
          path: /__w/_temp/kernel/qemu-${{ matrix.arch }}.config
          if-no-files-found: error
      - name: "Check 1: resolved config matches kernel/resolved"
        if: always() && steps.resolve.outcome == 'success'
        run: diff -u "kernel/resolved/qemu-${{ matrix.arch }}.config" "$WORK/out/.config"
      - name: "Checks 2 and 3: fragment lines landed, policy holds"
        if: always() && steps.resolve.outcome == 'success'
        run: |
          python3 -I scripts/check_kernel_config.py config --arch "${{ matrix.arch }}" --target qemu \
            --config "$WORK/out/.config" --source "$(echo "$WORK"/src/linux-*)"
      - name: "Check 4: kernel-hardening-checker"
        if: always() && steps.resolve.outcome == 'success'
        run: |
          khc=$WORK/khc
          rm -rf "$khc"
          git init -q "$khc"
          git -C "$khc" fetch -q --depth=1 https://github.com/a13xp0p0v/kernel-hardening-checker "$KHC_COMMIT"
          git -C "$khc" checkout -q FETCH_HEAD
          python3 -I scripts/check_kernel_config.py emit --arch "${{ matrix.arch }}" cmdline > "$WORK/cmdline"
          python3 -I scripts/check_kernel_config.py emit --arch "${{ matrix.arch }}" sysctl > "$WORK/sysctl"
          (cd "$khc" && python3 -I bin/kernel-hardening-checker -m json \
            -c "$WORK/out/.config" -l "$WORK/cmdline" -s "$WORK/sysctl") > "$WORK/hardening.json"
          python3 -I scripts/check_kernel_config.py hardening --arch "${{ matrix.arch }}" --report "$WORK/hardening.json"
      - name: Upload the hardening report
        if: always() && steps.resolve.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-hardening-qemu-${{ matrix.arch }}
          path: /__w/_temp/kernel/hardening.json
          if-no-files-found: ignore
      - name: Build
        run: scripts/kernel_build.sh build "${{ matrix.arch }}" "$WORK"
      - name: Collect the kernel
        run: |
          mkdir -p "$WORK/artifact"
          cp "$WORK/out/${{ matrix.image }}" "$WORK/out/System.map" "$WORK/out/.config" "$WORK/artifact/"
          cd "$WORK/artifact"
          sha256sum -- * .config
      # The kernel the image build (#2) boots. System.map stays with it so a
      # panic's raw addresses can be symbolised offline. Nothing inside an
      # artifact vouches for it, so #2 takes only this run's artifact or one
      # from a push to main, never the latest artifact with this name.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-qemu-${{ matrix.arch }}
          path: /__w/_temp/kernel/artifact/
          include-hidden-files: true
          if-no-files-found: error

  # The init the image installs at /usr/lib/ninelives/init. Built on the
  # runner with the toolchain rust-toolchain.toml pins; pinning the toolchain
  # archives by hash is tracked with the build pipeline pins (#65).
  init-binary:
    needs: kernel-changes
    if: needs.kernel-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.up.outputs.artifact-id }}
    defaults:
      run:
        working-directory: init
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install
      - name: Build
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build --remap-path-prefix=/home/runner/.cargo=/cargo
        run: cargo build --release --locked
      - id: up
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: init-x86_64
          path: init/target/release/init
          if-no-files-found: error

  # Build B of the kernel (image.md, "Reproducibility"): the x86_64 kernel again
  # on another runner, from the same pins, with no cache. It varies the work
  # path, the job count (one, against the runner's four) and the clock
  # (libfaketime, 400 days ahead, for the build step only: the tarball is
  # fetched at the real time). Only its artifact, kernel-qemu-x86_64-rebuild,
  # feeds image-rebuild, so a kernel runner that is compromised cannot reach
  # both builds of the image.
  kernel-rebuild:
    needs: kernel-changes
    if: needs.kernel-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: debian@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2 # trixie-20261104-slim
    outputs:
      artifact: ${{ steps.up.outputs.artifact-id }}
    env:
      DEBIAN_SNAPSHOT: 20261118T000000Z
      WORK: /__w/_temp/kernel-other
    steps:
      - name: Toolchain from the pinned snapshot
        run: |
          keyring=$(sed -n 's/^Signed-By: //p' /etc/apt/sources.list.d/debian.sources | head -n1)
          test -s "$keyring"
          rm /etc/apt/sources.list.d/debian.sources
          cat > /etc/apt/sources.list.d/snapshot.sources <<EOF
          Types: deb
          URIs: http://snapshot.debian.org/archive/debian/${DEBIAN_SNAPSHOT}
          Suites: trixie trixie-updates
          Components: main
          Signed-By: ${keyring}

          Types: deb
          URIs: http://snapshot.debian.org/archive/debian-security/${DEBIAN_SNAPSHOT}
          Suites: trixie-security
          Components: main
          Signed-By: ${keyring}
          EOF
          apt-get -o Acquire::Check-Valid-Until=false -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            bc bison ca-certificates clang flex git gpgv libc6-dev libelf-dev lld llvm make python3 xz-utils
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify the tarball and resolve the config
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/kernel_build.sh resolve x86_64 "$WORK"
          diff -u kernel/resolved/qemu-x86_64.config "$WORK/out/.config"
      # libfaketime from images/debian.lock, checked against its SHA-256 and
      # unpacked, not installed.
      - name: libfaketime from the lock
        run: |
          python3 -I scripts/fetch_image.py --out "$WORK/faketime-store" --faketime
          python3 -I scripts/faketime_lib.py --store "$WORK/faketime-store" --out "$WORK/faketime" > "$WORK/faketime.path"
      - name: Build, one job, 400 days ahead
        run: |
          echo "the first build used $(nproc) jobs"
          NL_FAKETIME_LIB=$(cat "$WORK/faketime.path") NL_FAKETIME_DAYS=400 KERNEL_JOBS=1 \
            scripts/kernel_build.sh build x86_64 "$WORK"
      - name: Collect the kernel
        run: |
          mkdir -p "$WORK/artifact"
          cp "$WORK/out/arch/x86/boot/bzImage" "$WORK/out/System.map" "$WORK/out/.config" "$WORK/artifact/"
          cd "$WORK/artifact"
          sha256sum -- * .config
      - id: up
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-qemu-x86_64-rebuild
          path: /__w/_temp/kernel-other/artifact/
          include-hidden-files: true
          if-no-files-found: error

  # Build B of the init: another checkout path, another CARGO_HOME, one cargo
  # job, and cargo under libfaketime 400 days ahead for the build only (the
  # crates are fetched first, at the real time). libfaketime comes from images/debian.lock,
  # not the runner's apt.
  init-rebuild:
    needs: kernel-changes
    if: needs.kernel-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.up.outputs.artifact-id }}
    env:
      CARGO_HOME: /home/runner/cargo-other
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: other/checkout
      - name: libfaketime from the lock
        working-directory: other/checkout
        run: |
          python3 -I scripts/fetch_image.py --out "$RUNNER_TEMP/faketime-store" --faketime
          python3 -I scripts/faketime_lib.py --store "$RUNNER_TEMP/faketime-store" --out "$RUNNER_TEMP/faketime" > "$RUNNER_TEMP/faketime.path"
      - name: Toolchain
        working-directory: other/checkout/init
        run: rustup toolchain install
      - name: Fetch the crates
        working-directory: other/checkout/init
        run: cargo fetch --locked
      # rustc hangs under libfaketime (its threads wait on condition variables
      # with timeouts the library rewrites), so cargo and the build scripts it
      # runs see the moved clock and rustc itself does not.
      - name: Build, one job, cargo 400 days ahead
        timeout-minutes: 20
        working-directory: other/checkout/init
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}/other/checkout=/build --remap-path-prefix=/home/runner/cargo-other=/cargo
        run: |
          . ../scripts/faketime.sh
          faketime_on "$(cat "$RUNNER_TEMP/faketime.path")" 400
          printf '#!/bin/sh\nexec env -u LD_PRELOAD -u FAKETIME "$@"\n' > "$RUNNER_TEMP/real-clock-rustc"
          chmod +x "$RUNNER_TEMP/real-clock-rustc"
          RUSTC_WRAPPER="$RUNNER_TEMP/real-clock-rustc" cargo build --release --locked --offline
      - id: up
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: init-x86_64-rebuild
          path: other/checkout/init/target/release/init
          if-no-files-found: error

  # Builds the x86_64 qemu production image from this commit: fetch and
  # verify every input, build offline, check what boots (image.md). Takes the
  # kernel and init of this run, never an artifact from another one.
  image:
    needs: [kernel-changes, kernel, init-binary]
    if: needs.kernel-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.up.outputs.artifact-id }}
    # The same Debian 13 container as images/tools.toml names, by digest.
    # The build mounts the filesystem it makes, so it needs privileges.
    container:
      image: debian@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2 # trixie-20261104-slim
      options: --privileged
    steps:
      # The container has no git. scripts/image-build.sh installs python3,
      # gpgv, xz-utils and ca-certificates from images/debian.lock, each .deb
      # checked against its SHA-256, so the checkout is the tarball of the commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kernel-qemu-x86_64
          path: /__w/_temp/image/kernel
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: init-x86_64
          path: /__w/_temp/image/init
      - name: Build and check the image
        env:
          COMMIT: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ needs.kernel-changes.outputs.epoch }}
        run: |
          chmod +x /__w/_temp/image/init/init
          scripts/image-build.sh --kernel /__w/_temp/image/kernel --init /__w/_temp/image/init/init \
            --out /__w/_temp/image/out --work /__w/_temp/image/work
      - name: Sizes against the budget
        if: always()
        run: |
          {
            echo '### Image sizes'
            echo '```'
            ls -l /__w/_temp/image/out || true
            echo '```'
            echo "Budget: images/budget.toml. The check fails above it and warns at 90%."
          } >> "$GITHUB_STEP_SUMMARY"
      # The build phase has no network (I2): a download from inside a fresh
      # network namespace must fail, and the same download outside must work.
      - name: Fixture, a download in the build phase's namespace fails
        run: |
          fetch='import socket; socket.create_connection(("github.com", 443), timeout=10)'
          python3 -I -c "$fetch"
          if unshare --net -- python3 -I -c "$fetch" 2>/dev/null; then
            echo "a download worked inside the network namespace" >&2
            exit 1
          fi
      - id: up
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: image-qemu-x86_64
          path: /__w/_temp/image/out/
          if-no-files-found: error
      # A failed build never uploads under the name a good one has.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: image-qemu-x86_64-FAILED-checks
          path: /__w/_temp/image/out/
          if-no-files-found: ignore

  # Build B of the image (image.md, "Reproducibility"): the same commit and
  # pins as the image job, on another runner with no cache of any kind. It
  # takes the kernel and init of the two rebuild jobs, never build A's, and
  # fetches every input itself. It varies the checkout path, the work and
  # output paths, the user's name and home, the time zone, the CPU count (one)
  # and the clock (libfaketime, 400 days ahead, for the build phase). The
  # container runs as root because the build mounts the filesystem it makes, so
  # the user varies by name, not uid. The umask and locale are not varied: the
  # scripts pin both, and the caller's values are the runner's.
  image-rebuild:
    needs: [kernel-changes, kernel-rebuild, init-rebuild]
    if: needs.kernel-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      artifact: ${{ steps.up.outputs.artifact-id }}
    container:
      image: debian@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2 # trixie-20261104-slim
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: rebuild/src/other-checkout
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kernel-qemu-x86_64-rebuild
          path: /__w/_temp/rebuild-in/kernel
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: init-x86_64-rebuild
          path: /__w/_temp/rebuild-in/init
      - name: Build the image again, changed
        env:
          COMMIT: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ needs.kernel-changes.outputs.epoch }}
          NL_FAKETIME_DAYS: "400"
        run: |
          export TZ=Pacific/Kiritimati USER=builder LOGNAME=builder HOME=/home/builder
          mkdir -p "$HOME"
          chmod +x /__w/_temp/rebuild-in/init/init
          # One CPU where the first build had every one the runner has.
          echo "cpus: $(taskset -c 0 nproc), the first build: $(nproc)"
          taskset -c 0 rebuild/src/other-checkout/scripts/image-build.sh \
            --kernel /__w/_temp/rebuild-in/kernel --init /__w/_temp/rebuild-in/init/init \
            --out /__w/_temp/rebuild-out/b --work /__w/_temp/rebuild-work/elsewhere
      - id: up
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: image-qemu-x86_64-rebuild
          path: /__w/_temp/rebuild-out/b/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: image-qemu-x86_64-rebuild-FAILED-checks
          path: /__w/_temp/rebuild-out/b/
          if-no-files-found: ignore

  # Fails unless the two builds' SHA256SUMS are identical, and the kernel and
  # init of the two builds too. On a mismatch it uploads a diffoscope report
  # (diffoscope is the lock's compare set). A red run is never cleared by
  # re-running it: a retry would hide the nondeterminism it found, so a
  # mismatch is fixed in a commit.
  image-compare:
    needs: [kernel-changes, kernel, init-binary, image, kernel-rebuild, init-rebuild, image-rebuild]
    if: needs.kernel-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    container:
      image: debian@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2 # trixie-20261104-slim
    steps:
      - name: The two builds are two different uploads
        env:
          IMAGE_A: ${{ needs.image.outputs.artifact }}
          IMAGE_B: ${{ needs.image-rebuild.outputs.artifact }}
          INIT_A: ${{ needs.init-binary.outputs.artifact }}
          INIT_B: ${{ needs.init-rebuild.outputs.artifact }}
        run: |
          for v in IMAGE_A IMAGE_B INIT_A INIT_B; do
            [[ ${!v} =~ ^[0-9]+$ ]] || { echo "$v: no artifact id" >&2; exit 1; }
          done
          [[ $IMAGE_A != "$IMAGE_B" && $INIT_A != "$INIT_B" ]] || { echo "a build would be compared with itself" >&2; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.image.outputs.artifact }}
          merge-multiple: true
          path: /__w/_temp/compare/a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.image-rebuild.outputs.artifact }}
          merge-multiple: true
          path: /__w/_temp/compare/b
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kernel-qemu-x86_64
          path: /__w/_temp/compare/kernel-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kernel-qemu-x86_64-rebuild
          path: /__w/_temp/compare/kernel-b
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.init-binary.outputs.artifact }}
          merge-multiple: true
          path: /__w/_temp/compare/init-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.init-rebuild.outputs.artifact }}
          merge-multiple: true
          path: /__w/_temp/compare/init-b
      - name: Compare the two builds
        run: |
          scripts/image-compare.sh --a /__w/_temp/compare/a --b /__w/_temp/compare/b \
            --kernel-a /__w/_temp/compare/kernel-a --kernel-b /__w/_temp/compare/kernel-b \
            --init-a /__w/_temp/compare/init-a --init-b /__w/_temp/compare/init-b \
            --report /__w/_temp/compare/report --work /__w/_temp/compare/work
      - name: Summary
        if: always()
        run: |
          {
            echo '### Two builds'
            echo '```'
            cat /__w/_temp/compare/a/SHA256SUMS || true
            echo '---'
            cat /__w/_temp/compare/b/SHA256SUMS || true
            ( cd /__w/_temp/compare && sha256sum kernel-a/* kernel-a/.config kernel-b/* kernel-b/.config init-a/* init-b/* ) 2>/dev/null || true
            [[ -f /__w/_temp/compare/report/summary.txt ]] && { echo '---'; cat /__w/_temp/compare/report/summary.txt; }
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: image-reproducibility-report
          path: /__w/_temp/compare/report/
          if-no-files-found: warn

  # Boots the image of this run in qemu with UEFI, headless, serial to a log,
  # and a hard timeout (image.md, "Boot test"). qemu and the firmware come from
  # the lock's boot set, installed in the same pinned container the image was
  # built in. It takes the image-qemu-x86_64 artifact only: a failed build
  # uploads under another name, and a skipped or failed image job means this
  # job does not run. The container is started by tools/boot.sh, not by the
  # job, so it gets only /dev/kvm (when the runner has it) and not privileges.
  boot:
    needs: [kernel-changes, image]
    if: needs.kernel-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-qemu-x86_64
          path: ${{ runner.temp }}/boot/image
      - name: Accelerator
        run: |
          if [[ -e /dev/kvm ]]; then echo "/dev/kvm is there: the container gets it, KVM"; else echo "no /dev/kvm: TCG, with the longer timeout"; fi
      - name: Boot the image, then two corrupted copies
        run: |
          tools/boot.sh --out "$RUNNER_TEMP/boot/out" \
            --image "$(ls "$RUNNER_TEMP"/boot/image/*-production-x86_64.raw)"
      - name: Summary
        if: always()
        run: |
          {
            echo '### Boot'
            echo '```'
            grep -h '^boot-result' "$RUNNER_TEMP"/boot/out/boot-*.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: boot-serial-logs
          path: ${{ runner.temp }}/boot/out/
          if-no-files-found: warn

  # The one check main requires, so a job added later is covered without
  # changing the ruleset. A job skipped by its own condition counts as passed.
  ci-ok:
    name: CI ok
    if: always()
    needs: [lint, python, init, kernel-changes, kernel, init-binary, kernel-rebuild, init-rebuild, image, image-rebuild, image-compare, boot]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [[ "${{ join(needs.*.result, ' ') }}" =~ ^((success|skipped)\ ?)+$ ]]
