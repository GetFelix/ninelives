# Every executable, ELF file and shared library in the production root
# (docs/components/image.md, "Checks": no shells or interpreters). A path may
# use * for one directory's worth of one kind of file. No shell or
# interpreter may appear here. `needed` pins the shared libraries a
# network-facing binary links against.

# NineLives' own program: PID 1.
[[executable]]
path = "/usr/lib/ninelives/init"
origin = "ninelives-init (this commit)"
requirement = "S1"

# Components. Their shared libraries are pinned, so a new one fails the build.
[[executable]]
path = "/usr/lib/felix/felix-broker"
origin = "felix (components.toml)"
requirement = "S1, S4"
needed = ["libgcc_s.so.1", "libm.so.6", "libc.so.6"]

[[executable]]
path = "/usr/lib/felix/felix-controlplane"
origin = "felix (components.toml)"
requirement = "S1, S4"
needed = ["libgcc_s.so.1", "libm.so.6", "libc.so.6"]

[[executable]]
path = "/usr/lib/felixd/felixd"
origin = "felixd (components.toml)"
requirement = "S1, S4"
needed = ["libgcc_s.so.1", "libm.so.6", "libc.so.6", "ld-linux-x86-64.so.2"]

# The C library and its loader. The loader is listed because it has to run; the kernel
# refuses executable mappings of files on the noexec data partition.
[[executable]]
path = "/usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2"
origin = "libc6"
requirement = "S1"

