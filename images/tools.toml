# Everything the image build runs on, pinned (docs/components/image.md,
# "Inputs"). Change it only in a reviewed pull request that touches pin
# files and nothing else.

# mkosi runs from its source archive. It needs only Python's standard
# library, so nothing is resolved from PyPI.
[mkosi]
version = "27.1"
url = "https://github.com/systemd/mkosi/archive/refs/tags/v27.1.tar.gz"
sha256 = "33520d662e151d6c43e910c3840ac971fd6023e4488d9c10599e199a07f77d8b"

# The container the fetch phase and the build run in. The runner supplies only
# its kernel, container runtime and network. Debian 13 trixie-20261104-slim.
# The official Debian images are built with debuerreotype, whose stated aim is
# reproducible builds from snapshot.debian.org. We do not rebuild the image;
# the digest is the trust root.
#
# What the fetch phase runs on is not in that image. scripts/bootstrap.sh
# installs these packages into it, each .deb checked against the SHA-256 in
# debian.lock (the closure of these roots, minus what the image already has):
#   python3, gpgv, xz-utils   the fetch phase, InRelease and the kernel signature, xz archives
#   ca-certificates           https downloads (mkosi, Felix, felixd)
[bootstrap]
image = "debian@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2"
release = "trixie"
packages = ["ca-certificates", "gpgv", "python3", "xz-utils"]

# One snapshot.debian.org timestamp for everything Debian, for every
# architecture. The release of the image's root and the release of the build
# tools are separate pins, so either can move without the other.
#
# Where a pin differs by architecture, the keys directly in its table are
# x86_64's and a sub-table (here [boot.aarch64], [cosign.aarch64]) overrides
# them for aarch64. images/debian.lock is x86_64's lock and
# images/debian-aarch64.lock aarch64's. Builds are native: the aarch64 jobs
# run on arm64 runners, in the same container image (the digest below is the
# multi-architecture index), so the tools are arm64 packages.
[debian]
snapshot = "20261118T000000Z"

[root]
release = "trixie"

[tools]
release = "trixie"
# Roots of the tools set; debian.lock holds their closure. Why each:
#   python3, apt, dpkg  mkosi and the install of the root
#   erofs-utils         mkfs.erofs and fsck.erofs
#   cryptsetup-bin      veritysetup
#   systemd-repart      the GPT disk
#   systemd-ukify, python3-pefile, systemd-boot-efi   the unified kernel image and its EFI stub
#   dosfstools, mtools  the ESP's vfat, which repart makes
#   gpgv                signature checks
#   xz-utils, tar, util-linux, e2fsprogs   unpacking, mounts for the checks
packages = [
  "apt", "cryptsetup-bin", "dosfstools", "dpkg", "e2fsprogs", "erofs-utils", "gpgv",
  "mount", "mtools", "python3", "python3-pefile", "systemd", "systemd-boot-efi",
  "systemd-repart", "systemd-ukify", "tar", "util-linux", "xz-utils",
]

# What the init is built with besides the pinned Rust toolchain (scripts/init-build.sh).
# rustc links through `cc`, so the build needs gcc and the C library's headers and
# start files. scripts/bootstrap.sh installs this set into the bootstrap container,
# each .deb checked against the lock, and may upgrade a package the container has.
#   gcc        the linker driver, with binutils' ld
#   libc6-dev  crt1.o, libc.so and the headers the build scripts compile against
[build]
release = "trixie"
packages = ["gcc", "libc6-dev"]

# What the CI boot test runs the image on (docs/components/image.md, "Boot test").
# Same snapshot, same lock, same verification as the tools. The boot job and
# tools/boot.sh install exactly this set in the bootstrap container.
#   qemu-system-x86  qemu-system-x86_64
#   ovmf             the UEFI firmware, /usr/share/OVMF/OVMF_CODE_4M.fd
# On aarch64 the machine is qemu's `virt` and the firmware is Debian's AAVMF:
#   qemu-system-arm  qemu-system-aarch64
#   qemu-efi-aarch64 /usr/share/AAVMF/AAVMF_CODE.fd
[boot]
release = "trixie"
packages = ["ovmf", "qemu-system-x86"]
qemu = "qemu-system-x86_64"
firmware_code = "/usr/share/OVMF/OVMF_CODE_4M.fd"
firmware_vars = "/usr/share/OVMF/OVMF_VARS_4M.fd"

[boot.aarch64]
packages = ["qemu-efi-aarch64", "qemu-system-arm"]
qemu = "qemu-system-aarch64"
firmware_code = "/usr/share/AAVMF/AAVMF_CODE.fd"
firmware_vars = "/usr/share/AAVMF/AAVMF_VARS.fd"

# What the CI comparison job runs on (docs/components/image.md,
# "Reproducibility"): diffoscope, installed from the same snapshot and lock,
# never from the runner or PyPI. The format tools are what it calls to open
# each output instead of falling back to a hex dump.
#   diffoscope-minimal  the comparison
#   binutils            the PE sections of the unified kernel image
#   fdisk               the GPT disk
#   erofs-utils         the root filesystem
#   xxd                 the hex view of what has no reader
[compare]
release = "trixie"
packages = ["binutils", "diffoscope-minimal", "erofs-utils", "fdisk", "xxd"]

# libfaketime, for the rebuilds that run at another time (docs/components/image.md,
# "Reproducibility"). Only the library is used: scripts/faketime_lib.py unpacks
# the verified .deb and the rebuild preloads it. Never installed.
[faketime]
release = "trixie"
packages = ["libfaketime"]

# The Rust toolchain the init is built with, by exact version (init/rust-toolchain.toml
# names the same one; scripts/init_toolchain.py check keeps them equal). Each archive
# is pinned by SHA-256 because rustup does not enforce signatures. A bump runs
# scripts/pin_toolchain.py, which checks the published .sha256 and the .asc signature
# against images/keys/rust/ and writes this block; the build checks only the hashes.
# The builds are native, so each architecture has its own host archives.
# BEGIN rust pins (scripts/pin_toolchain.py)
[rust]
version = "1.99.1"
triple = "x86_64-unknown-linux-gnu"

[[rust.component]]
name = "rustc"
url = "https://static.rust-lang.org/dist/rustc-1.99.1-x86_64-unknown-linux-gnu.tar.xz"
sha256 = "2ff05ff9c08a90861e7f6e4065b40a8b87463b4576186fd613871c3e37f2091f"

[[rust.component]]
name = "cargo"
url = "https://static.rust-lang.org/dist/cargo-1.99.1-x86_64-unknown-linux-gnu.tar.xz"
sha256 = "53f3521949404d595efb06a55c12c5658d4ed1c75566f33d3d514eaebe70bd8a"

[[rust.component]]
name = "rust-std"
url = "https://static.rust-lang.org/dist/rust-std-1.99.1-x86_64-unknown-linux-gnu.tar.xz"
sha256 = "109b074225bf5b9ea3820890876bfdf4ed161adbfaf94b2b4b5984c85ee5d958"

[rust.aarch64]
triple = "aarch64-unknown-linux-gnu"

[[rust.aarch64.component]]
name = "rustc"
url = "https://static.rust-lang.org/dist/rustc-1.99.1-aarch64-unknown-linux-gnu.tar.xz"
sha256 = "acdcdfe09ae1f103aa9a2b7f88903a9588bc2e99288af10e6fbf5514e2e49f25"

[[rust.aarch64.component]]
name = "cargo"
url = "https://static.rust-lang.org/dist/cargo-1.99.1-aarch64-unknown-linux-gnu.tar.xz"
sha256 = "5156832e0c1254e9b49a79edabdc6d4c35f32f8fc1cf3ca700f268ff96087ab0"

[[rust.aarch64.component]]
name = "rust-std"
url = "https://static.rust-lang.org/dist/rust-std-1.99.1-aarch64-unknown-linux-gnu.tar.xz"
sha256 = "e25668477083d6a9ddb87b9beb9c00742225f38233ccb4bfba3afa7a07427f52"
# END rust pins

# Verifies the Sigstore bundle on a component's SHA256SUMS (scripts/fetch_image.py).
# A static binary, run in the bootstrap container with the trusted root below and
# the bundle, so it reaches no TUF or Rekor server. The fetch checks this hash
# before running it. The fetch phase runs the one for its own architecture.
[cosign]
version = "3.1.4"
url = "https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64"
sha256 = "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa"

[cosign.aarch64]
url = "https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-arm64"
sha256 = "ade83b7aac62e131cacfe96d958948b2150cc9efec46a570a2649b8e27dedad2"

# What the bundle is verified against: Fulcio's and Rekor's public keys, copied
# from targets/trusted_root.json in github.com/sigstore/root-signing at commit
# c9bda74a (2025-09-22); see images/keys/sigstore/README.md. Replacing it is a
# reviewed change, and the hash below has to change with it.
[sigstore]
trusted_root = "images/keys/sigstore/trusted_root.json"
trusted_root_sha256 = "6494e21ea73fa7ee769f85f57d5a3e6a08725eae1e38c755fc3517c9e6bc0b66"

# The kernel config checker the image job runs on the kernel config the image
# ships (scripts/image_hardening.py). The kernel job runs the same commit from
# git (KHC_COMMIT in ci.yml); a test keeps the two equal.
[kernel_hardening_checker]
version = "0.6.17.1"
commit = "afc376f2a935994793343cfeb05953583cc30191"
url = "https://codeload.github.com/a13xp0p0v/kernel-hardening-checker/tar.gz/afc376f2a935994793343cfeb05953583cc30191"
sha256 = "3e5f3ea80c6e82afd5550211d240daabf0676e900ca651b3a207c6946e04521d"
