[package]
name = "ninelives-init"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "PID 1 for NineLives machines"
publish = false

[[bin]]
name = "init"
path = "src/main.rs"

# The init is Linux-only; the pure logic and its unit tests build anywhere.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2.191", default-features = false }
rustix = { version = "1.1.6", default-features = false, features = ["std", "event", "fs", "mount", "process", "system", "time", "thread"] }

[lints]
workspace = true

[workspace]
members = ["."]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

# PID 1 must not unwind: there is nothing above main to catch it, and a
# half-unwound init is worse than a reboot. See the panic hook in console.rs.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Arithmetic is checked by lint; an overflow it missed aborts rather than
# computing a wrong deadline.
overflow-checks = true
