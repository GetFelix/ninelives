# aarch64 only.

[[exception]]
option = "CONFIG_ARM_SMMU"
arch = ["aarch64"]
reason = "No SMMU on qemu virt. Added with the first aarch64 target that has one (M5), with DISABLE_BYPASS_BY_DEFAULT."

[[exception]]
option = "CONFIG_ARM_SMMU_V3"
arch = ["aarch64"]
reason = "No SMMU on qemu virt. Added with the first aarch64 target that has one (M5)."

[[exception]]
option = "CONFIG_ARM_SMMU_DISABLE_BYPASS_BY_DEFAULT"
arch = ["aarch64"]
reason = "Exists only with ARM_SMMU; see that exception."

[[exception]]
option = "CONFIG_RANDOMIZE_MODULE_REGION_FULL"
arch = ["aarch64"]
reason = "There are no modules, so there is no module region to randomise."

[[exception]]
option = "CONFIG_RODATA_FULL_DEFAULT_ENABLED"
arch = ["aarch64"]
reason = "Removed upstream; rodata=full is the default in 6.18."
