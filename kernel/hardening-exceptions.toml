# Sysctls. Network sysctls belong to the network design (kernel.md, What it
# does not do); it decides accept_redirects and accept_ra, which T70 cares about.

[[exception]]
option = "vm.mmap_min_addr"
type = "sysctl"
arch = ["x86_64", "aarch64"]
reason = "DEFAULT_MMAP_MIN_ADDR=65536 sets it, and /proc/sys is read-only after boot."

[[exception]]
option = "vm.mmap_rnd_bits"
type = "sysctl"
arch = ["x86_64", "aarch64"]
reason = "ARCH_MMAP_RND_BITS is at its maximum for the architecture in config."

[[exception]]
option = "kernel.randomize_va_space"
type = "sysctl"
arch = ["x86_64", "aarch64"]
reason = "The kernel default is 2, /proc/sys is read-only after boot, and check 5 rejects norandmaps."

[[exception]]
option = "kernel.dmesg_restrict"
type = "sysctl"
arch = ["x86_64", "aarch64"]
reason = "SECURITY_DMESG_RESTRICT sets it to 1."

[[exception]]
option = "dev.tty.ldisc_autoload"
type = "sysctl"
arch = ["x86_64", "aarch64"]
reason = "LDISC_AUTOLOAD is off, and there are no modules to autoload."

[[exception]]
option = "dev.tty.legacy_tiocsti"
type = "sysctl"
arch = ["x86_64", "aarch64"]
reason = "LEGACY_TIOCSTI is off in config."

[[exception]]
option = "user.max_user_namespaces"
type = "sysctl"
arch = ["x86_64", "aarch64"]
reason = "USER_NS is compiled out; the sysctl does not exist."

[[exception]]
option = "kernel.oops_limit"
type = "sysctl"
arch = ["x86_64", "aarch64"]
reason = "oops=panic panics on the first oops."

[[exception]]
option = "kernel.warn_limit"
type = "sysctl"
arch = ["x86_64", "aarch64"]
reason = "Same reasoning as panic_on_warn being off: one WARN reachable on every machine would reboot the whole cluster (kernel.md, The command line)."

[[exception]]
option = "kernel.perf_event_paranoid"
type = "sysctl"
arch = ["x86_64", "aarch64"]
reason = "Wants 3, which is a distribution patch; 2 is the strictest upstream level. On aarch64 perf is compiled out and the sysctl does not exist."

