# Every kernel-hardening-checker finding that is not fixed, with the reason
# (S2, docs/components/kernel.md check 4). scripts/check_kernel_config.py
# fails on a finding missing here, and on an entry that no longer fails or
# that the checker no longer reports.
#
# option: the checker's option name (CONFIG_ names for kconfig checks).
# type:   kconfig (default), cmdline or sysctl.
# arch:   the architectures the exception applies to.

# Kconfig.

[[exception]]
option = "CONFIG_RANDSTRUCT_FULL"
arch = ["x86_64", "aarch64"]
reason = "S5: the build is reproducible, so the layout seed would be published, and a published seed gives the layout away (kernel.md, Reproducibility)."

[[exception]]
option = "CONFIG_KSTACK_ERASE"
arch = ["x86_64", "aarch64"]
reason = "Needs Clang's sanitizer-coverage stack depth callback, which Debian 13's Clang 19 lacks. Comes back with a toolchain that has it (kernel.md open question)."

[[exception]]
option = "CONFIG_KSTACK_ERASE_METRICS"
arch = ["x86_64", "aarch64"]
reason = "Reported only because KSTACK_ERASE is off; see that exception."

[[exception]]
option = "CONFIG_KSTACK_ERASE_RUNTIME_DISABLE"
arch = ["x86_64", "aarch64"]
reason = "Reported only because KSTACK_ERASE is off; see that exception."

[[exception]]
option = "CONFIG_GCC_PLUGIN_LATENT_ENTROPY"
arch = ["x86_64", "aarch64"]
reason = "A GCC plugin; the kernel is built with Clang for kCFI and the shadow call stack."

[[exception]]
option = "CONFIG_CFI_CLANG"
arch = ["x86_64", "aarch64"]
reason = "Renamed to CONFIG_CFI upstream; the pinned checker predates the rename. CONFIG_CFI=y is required by policy.toml."

[[exception]]
option = "CONFIG_CFI_PERMISSIVE"
arch = ["x86_64", "aarch64"]
reason = "Reported only through the CFI_CLANG name; CFI_PERMISSIVE is unset and policy.toml requires that."

[[exception]]
option = "CONFIG_SECURITY_SELINUX"
arch = ["x86_64", "aarch64"]
reason = "S6: the init's policy is uids, Landlock and seccomp. A MAC policy nobody writes is surface without protection (kernel.md, LSMs)."

[[exception]]
option = "CONFIG_LSM"
arch = ["x86_64", "aarch64"]
reason = "Wants selinux in the list; see the SECURITY_SELINUX exception. The list is exactly landlock,lockdown,yama."

[[exception]]
option = "CONFIG_LSM_MMAP_MIN_ADDR"
arch = ["x86_64", "aarch64"]
reason = "Exists only with SELinux. DEFAULT_MMAP_MIN_ADDR=65536 sets the floor."

[[exception]]
option = "CONFIG_RSEQ"
arch = ["x86_64", "aarch64"]
reason = "glibc registers rseq for every thread (kernel.md, EXPERT options)."

[[exception]]
option = "CONFIG_SCHED_CORE"
arch = ["x86_64", "aarch64"]
reason = "Core scheduling only acts on tasks given a cookie, and nothing sets one; it would add a prctl interface for nothing. SMT is reopened with bare metal (M5)."

[[exception]]
option = "CONFIG_HW_RANDOM_TPM"
arch = ["x86_64", "aarch64"]
reason = "No TPM driver until M3 (kernel.md open questions); virtio-rng seeds the pool."

[[exception]]
option = "CONFIG_SLUB_DEBUG"
arch = ["x86_64", "aarch64"]
reason = "Only enables the slub_debug= boot parameter's debugging; nothing on the command line uses it, and every slab hardening option is set."

[[exception]]
option = "CONFIG_WERROR"
arch = ["x86_64", "aarch64"]
reason = "A new compiler warning in a point release would block a security fix past S9's deadline. The toolchain is pinned and warnings show in the build log."

# Command line. The image design owns the line; kernel.md lists the words
# the kernel policy requires.

[[exception]]
option = "mitigations"
type = "cmdline"
arch = ["x86_64"]
reason = "Wants auto,nosmt. SMT stays on (kernel.md, CPU flaws); auto is the default, and check 5 rejects mitigations=off."

[[exception]]
option = "nosmt"
type = "cmdline"
arch = ["x86_64", "aarch64"]
reason = "SMT stays on: in a guest nosmt halves the vCPUs and buys little. Reopened for bare metal (M5)."

[[exception]]
option = "hash_pointers"
type = "cmdline"
arch = ["x86_64", "aarch64"]
reason = "The default already hashes %p output, kptr_restrict=2 hides %pK, and check 5 rejects no_hash_pointers."

[[exception]]
option = "iommu"
type = "cmdline"
arch = ["x86_64"]
reason = "Wants iommu=force. The qemu target has no IOMMU; strict DMA mode is set by config. Decided with bare metal (M5)."

[[exception]]
option = "rodata"
type = "cmdline"
arch = ["aarch64"]
reason = "rodata=full is the 6.18 default (RODATA_FULL_DEFAULT_ENABLED no longer exists), and check 5 rejects any rodata= word."

# Each x86 per-mitigation word passes the checker only when present and not
# off, or with mitigations=auto,nosmt. Absent, the kernel uses its default,
# which the CONFIG_MITIGATION_* options set on; check 5 rejects any word that sets them.

