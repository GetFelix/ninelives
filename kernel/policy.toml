# What the resolved kernel config must and must not contain, the sysctls the
# kernel policy expects, the command line words it requires, and the only
# other parameters the command line may carry
# (docs/components/kernel.md). scripts/check_kernel_config.py reads this file;
# the qemu tests will read it too.
#
# The [common] tables apply to both architectures; [x86_64] and [aarch64]
# add to them. An option in "unset" passes when the resolved config says
# "is not set" or does not mention it. This list is checked on its own, so
# removing an entry is visible in review instead of lost in a config diff.

[common]
unset = [
  # S2, T16: no code added at run time.
  "CONFIG_MODULES",
  "CONFIG_KEXEC",
  "CONFIG_KEXEC_FILE",
  "CONFIG_KEXEC_CORE",
  "CONFIG_KEXEC_HANDOVER",
  "CONFIG_CRASH_DUMP",
  "CONFIG_HIBERNATION",
  "CONFIG_SUSPEND",
  "CONFIG_BINFMT_MISC",
  "CONFIG_BINFMT_SCRIPT",
  "CONFIG_UEVENT_HELPER",
  "CONFIG_COREDUMP",
  "CONFIG_ELF_CORE",
  # S6, T16: interfaces that bypass or widen the sandbox.
  "CONFIG_IO_URING",
  "CONFIG_BPF_SYSCALL",
  "CONFIG_BPF_LSM",
  "CONFIG_USER_NS",
  "CONFIG_NET_NS",
  "CONFIG_IPC_NS",
  "CONFIG_UTS_NS",
  "CONFIG_TIME_NS",
  "CONFIG_USERFAULTFD",
  "CONFIG_KEYS",
  "CONFIG_SYSVIPC",
  "CONFIG_POSIX_MQUEUE",
  "CONFIG_CHECKPOINT_RESTORE",
  "CONFIG_KCMP",
  "CONFIG_FHANDLE",
  "CONFIG_SYSFS_SYSCALL",
  "CONFIG_UID16",
  "CONFIG_AIO",
  "CONFIG_CRYPTO_USER",
  "CONFIG_CRYPTO_USER_API",
  "CONFIG_CRYPTO_USER_API_HASH",
  "CONFIG_CRYPTO_USER_API_SKCIPHER",
  "CONFIG_CRYPTO_USER_API_RNG",
  "CONFIG_CRYPTO_USER_API_AEAD",
  # T16: information that makes exploits reliable.
  "CONFIG_KALLSYMS",
  "CONFIG_DEBUG_FS",
  "CONFIG_FTRACE",
  "CONFIG_KPROBES",
  "CONFIG_UPROBES",
  "CONFIG_PROFILING",
  "CONFIG_PROC_KCORE",
  "CONFIG_MAGIC_SYSRQ",
  "CONFIG_KGDB",
  "CONFIG_DEVMEM",
  "CONFIG_DEVPORT",
  "CONFIG_ACPI_TABLE_UPGRADE",
  "CONFIG_ACPI_DEBUGGER",
  "CONFIG_EFIVAR_FS",
  "CONFIG_SWAP",
  # S6: no other LSMs.
  "CONFIG_SECURITY_SELINUX",
  "CONFIG_SECURITY_APPARMOR",
  "CONFIG_SECURITY_SMACK",
  "CONFIG_SECURITY_TOMOYO",
  "CONFIG_SECURITY_LOADPIN",
  "CONFIG_SECURITY_SAFESETID",
  "CONFIG_SECURITY_IPE",
  # T16: hardening that must not be weakened.
  "CONFIG_CFI_PERMISSIVE",
  "CONFIG_SLAB_MERGE_DEFAULT",
  "CONFIG_COMPAT_BRK",
  "CONFIG_LEGACY_PTYS",
  "CONFIG_LDISC_AUTOLOAD",
  "CONFIG_STRICT_DEVMEM",
  "CONFIG_RANDSTRUCT_FULL",
  "CONFIG_RANDSTRUCT_PERFORMANCE",
  # S7, S18, T18, T70: nftables only, nothing that rewrites packets after it.
  "CONFIG_NETFILTER_XTABLES",
  "CONFIG_NETFILTER_XTABLES_LEGACY",
  "CONFIG_NETFILTER_XTABLES_COMPAT",
  "CONFIG_IP_NF_IPTABLES",
  "CONFIG_IP_NF_IPTABLES_LEGACY",
  "CONFIG_IP6_NF_IPTABLES",
  "CONFIG_IP6_NF_IPTABLES_LEGACY",
  "CONFIG_IP_NF_ARPTABLES",
  "CONFIG_BRIDGE_NF_EBTABLES",
  "CONFIG_BRIDGE_NF_EBTABLES_LEGACY",
  "CONFIG_NFT_COMPAT",
  "CONFIG_NF_TABLES_ARP",
  "CONFIG_NF_TABLES_BRIDGE",
  "CONFIG_NF_TABLES_NETDEV",
  "CONFIG_NF_NAT",
  "CONFIG_NFT_NAT",
  "CONFIG_NF_CONNTRACK_FTP",
  "CONFIG_NF_CONNTRACK_SIP",
  "CONFIG_NF_CONNTRACK_H323",
  "CONFIG_NF_CONNTRACK_IRC",
  "CONFIG_NF_CONNTRACK_TFTP",
  "CONFIG_NF_CONNTRACK_AMANDA",
  "CONFIG_NF_CONNTRACK_PPTP",
  "CONFIG_NF_CONNTRACK_SANE",
  "CONFIG_NF_CONNTRACK_SNMP",
  "CONFIG_NF_CONNTRACK_NETBIOS_NS",
  "CONFIG_NF_CONNTRACK_BROADCAST",
  "CONFIG_NF_CT_NETLINK",
  "CONFIG_NETFILTER_NETLINK_QUEUE",
  "CONFIG_NETFILTER_NETLINK_LOG",
  "CONFIG_NETFILTER_NETLINK_ACCT",
  "CONFIG_NETFILTER_NETLINK_OSF",
  "CONFIG_NET_SCHED",
  "CONFIG_NET_CLS",
  "CONFIG_NET_CLS_ACT",
  "CONFIG_NET_XGRESS",
  "CONFIG_TUN",
  "CONFIG_BRIDGE",
  "CONFIG_VLAN_8021Q",
  "CONFIG_MACVLAN",
  "CONFIG_IPVLAN",
  "CONFIG_VETH",
  "CONFIG_VXLAN",
  "CONFIG_GENEVE",
  "CONFIG_NET_IPIP",
  "CONFIG_NET_IPGRE",
  "CONFIG_NET_IPGRE_DEMUX",
  "CONFIG_NET_IPVTI",
  "CONFIG_IPV6_SIT",
  "CONFIG_IPV6_TUNNEL",
  "CONFIG_IPV6_VTI",
  "CONFIG_WIREGUARD",
  "CONFIG_XFRM",
  "CONFIG_XFRM_USER",
  "CONFIG_MPLS",
  "CONFIG_FIB_RULES",
  "CONFIG_LWTUNNEL",
  "CONFIG_NET_SHAPER",
  "CONFIG_IP_VS",
  "CONFIG_OPENVSWITCH",
  # T16: protocol families no service uses.
  "CONFIG_IP_SCTP",
  "CONFIG_TIPC",
  "CONFIG_RDS",
  "CONFIG_L2TP",
  "CONFIG_CAN",
  "CONFIG_BT",
  "CONFIG_WIRELESS",
  "CONFIG_CFG80211",
  "CONFIG_NFC",
  "CONFIG_X25",
  "CONFIG_AX25",
  "CONFIG_ATM",
  "CONFIG_VSOCKETS",
  "CONFIG_INET_DIAG",
  "CONFIG_PACKET_DIAG",
  "CONFIG_UNIX_DIAG",
  "CONFIG_NETLINK_DIAG",
  # T54: buses, devices and filesystems no M0 to M2 target has.
  "CONFIG_USB_SUPPORT",
  "CONFIG_USB4",
  "CONFIG_FIREWIRE",
  "CONFIG_SOUND",
  "CONFIG_DRM",
  "CONFIG_FB",
  "CONFIG_HID",
  "CONFIG_WLAN",
  "CONFIG_BLK_DEV_NVME",
  "CONFIG_SCSI",
  "CONFIG_KVM",
  "CONFIG_VIRTIO_BALLOON",
  "CONFIG_VIRTIO_VSOCKETS",
  "CONFIG_VIRTIO_INPUT",
  "CONFIG_DRM_VIRTIO_GPU",
  "CONFIG_NET_9P",
  "CONFIG_VT",
  "CONFIG_FUSE_FS",
  "CONFIG_OVERLAY_FS",
  "CONFIG_NFS_FS",
  "CONFIG_CIFS",
  "CONFIG_SQUASHFS",
  "CONFIG_VFAT_FS",
  "CONFIG_MSDOS_FS",
  # image: the root and how it is set up.
  "CONFIG_BLK_DEV_INITRD",
  "CONFIG_EROFS_FS_ZIP",
  "CONFIG_EROFS_FS_XATTR",
  "CONFIG_EROFS_FS_POSIX_ACL",
  "CONFIG_DM_VERITY_FEC",
  "CONFIG_DM_VERITY_VERIFY_ROOTHASH_SIG",
  "CONFIG_DEVTMPFS_MOUNT",
  "CONFIG_RUST",
