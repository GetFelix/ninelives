# Values as they appear in the resolved .config.
[common.set]
# S2, S24: the kernel never starts a user program; the helper path is empty.
CONFIG_STATIC_USERMODEHELPER = "y"
CONFIG_STATIC_USERMODEHELPER_PATH = '""'
# T16, T22, T47: lockdown in confidentiality mode from early boot.
CONFIG_SECURITY = "y"
CONFIG_SECURITYFS = "y"
CONFIG_SECURITY_LOCKDOWN_LSM = "y"
CONFIG_SECURITY_LOCKDOWN_LSM_EARLY = "y"
CONFIG_LOCK_DOWN_KERNEL_FORCE_CONFIDENTIALITY = "y"
# S6, T17: the LSMs that run, and only those.
CONFIG_SECURITY_LANDLOCK = "y"
CONFIG_SECURITY_YAMA = "y"
CONFIG_LSM = '"landlock,lockdown,yama"'
CONFIG_SECCOMP = "y"
CONFIG_SECCOMP_FILTER = "y"
CONFIG_PROC_MEM_NO_FORCE = "y"
# T16: classic BPF is JIT-compiled. The interpreter is still built, because
# BPF_JIT_ALWAYS_ON needs BPF_SYSCALL; bpf_jit_enable=1 below keeps it unused.
CONFIG_BPF_JIT = "y"
# T16: information leaks.
CONFIG_SECURITY_DMESG_RESTRICT = "y"
# T16: memory corruption hardening.
CONFIG_STACKPROTECTOR_STRONG = "y"
CONFIG_VMAP_STACK = "y"
CONFIG_SCHED_STACK_END_CHECK = "y"
CONFIG_RANDOMIZE_KSTACK_OFFSET_DEFAULT = "y"
CONFIG_INIT_STACK_ALL_ZERO = "y"
CONFIG_ZERO_CALL_USED_REGS = "y"
CONFIG_HARDENED_USERCOPY = "y"
CONFIG_FORTIFY_SOURCE = "y"
CONFIG_UBSAN_BOUNDS = "y"
CONFIG_UBSAN_TRAP = "y"
CONFIG_INIT_ON_ALLOC_DEFAULT_ON = "y"
CONFIG_INIT_ON_FREE_DEFAULT_ON = "y"
CONFIG_SLAB_FREELIST_RANDOM = "y"
CONFIG_SLAB_FREELIST_HARDENED = "y"
CONFIG_SLAB_BUCKETS = "y"
CONFIG_RANDOM_KMALLOC_CACHES = "y"
CONFIG_SHUFFLE_PAGE_ALLOCATOR = "y"
CONFIG_KFENCE = "y"
CONFIG_LIST_HARDENED = "y"
CONFIG_BUG_ON_DATA_CORRUPTION = "y"
CONFIG_PAGE_TABLE_CHECK_ENFORCED = "y"
CONFIG_DEBUG_WX = "y"
CONFIG_STRICT_KERNEL_RWX = "y"
CONFIG_RANDOMIZE_BASE = "y"
CONFIG_DEFAULT_MMAP_MIN_ADDR = "65536"
CONFIG_CFI = "y"
CONFIG_RANDSTRUCT_NONE = "y"
# T54: hostile DMA.
CONFIG_IOMMU_SUPPORT = "y"
CONFIG_IOMMU_DEFAULT_DMA_STRICT = "y"
CONFIG_EFI_DISABLE_PCI_DMA = "y"
# T56: CPU flaws.
CONFIG_CPU_MITIGATIONS = "y"
# init, felix: what the services depend on, so a missing one fails here
# rather than at boot.
CONFIG_MULTIUSER = "y"
CONFIG_PID_NS = "y"
CONFIG_CGROUPS = "y"
CONFIG_MEMCG = "y"
CONFIG_CGROUP_PIDS = "y"
CONFIG_CGROUP_SCHED = "y"
CONFIG_BLK_CGROUP_IOCOST = "y"
CONFIG_SIGNALFD = "y"
CONFIG_EPOLL = "y"
CONFIG_TIMERFD = "y"
CONFIG_EVENTFD = "y"
CONFIG_FUTEX = "y"
CONFIG_FILE_LOCKING = "y"
CONFIG_MEMFD_CREATE = "y"
CONFIG_QFMT_V2 = "y"
CONFIG_WATCHDOG_NOWAYOUT = "y"
CONFIG_IKCONFIG_PROC = "y"
# image: the verified root.
CONFIG_DM_INIT = "y"
CONFIG_DM_VERITY = "y"
CONFIG_EROFS_FS = "y"
# S7, S18: the packet filter.
CONFIG_NF_TABLES = "y"
CONFIG_NF_TABLES_INET = "y"

# Lines in upstream's hardening.config that cannot land here, with the reason.
# The check fails on any other hardening.config line that does not land, and
# on an entry here that did land.
[common.upstream_not_applied]
CONFIG_STRICT_MODULE_RWX = "needs CONFIG_MODULES, which is off"
CONFIG_STRICT_DEVMEM = "needs CONFIG_DEVMEM, which is off: there is no /dev/mem to restrict"
CONFIG_IO_STRICT_DEVMEM = "needs CONFIG_DEVMEM, which is off"
CONFIG_KSTACK_ERASE = "needs CC_HAS_SANCOV_STACK_DEPTH_CALLBACK, which Debian 13's Clang 19 lacks (kernel.md open question)"

# Set by the command line before PID 1 starts (kernel.md, "The command line").
[common.sysctl]
"kernel.kptr_restrict" = "2"
"kernel.yama.ptrace_scope" = "3"
"net.core.bpf_jit_enable" = "1"
"net.core.bpf_jit_harden" = "2"
"vm.memfd_noexec" = "2"
"fs.suid_dumpable" = "0"
"fs.protected_symlinks" = "1"
"fs.protected_hardlinks" = "1"
"fs.protected_fifos" = "2"
"fs.protected_regular" = "2"

[common.cmdline]
# Every sysctl above is also required as a sysctl.<name>=<value> word.
required = ["ro", "panic=10", "oops=panic", "page_alloc.shuffle=1"]
# The command line may hold only the required words and these parameters,
# which the image design owns (image.md, "Boot without an initrd"): the root
# and its dm-verity table, init, and the console. Any other word fails check
# 5, so a protection cannot be turned off by a spelling nobody listed. Keys
# compare with dashes and underscores alike, as the kernel compares them.
image_keys = [
  "root", "rootfstype", "rootflags", "rootwait",
  "init",
  "console", "earlycon", "loglevel", "quiet",
]
# Any key that starts with one of these: dm-mod.create and dm-mod.waitfor.
image_prefixes = ["dm-mod."]

[x86_64]
# Every option in the tree with one of these prefixes must be in [x86_64.set]
# or [x86_64.not_applicable].
all_listed = ["CONFIG_MITIGATION_"]
unset = [
  "CONFIG_IA32_EMULATION",
  "CONFIG_X86_X32_ABI",
  "CONFIG_COMPAT",
  "CONFIG_MODIFY_LDT_SYSCALL",
  "CONFIG_X86_IOPL_IOPERM",
  "CONFIG_X86_MSR",
  "CONFIG_X86_CPUID",
  "CONFIG_X86_16BIT",
  "CONFIG_MICROCODE_LATE_LOADING",
  "CONFIG_LEGACY_VSYSCALL_XONLY",
  "CONFIG_X86_INTEL_TSX_MODE_ON",
  "CONFIG_X86_INTEL_TSX_MODE_AUTO",
]

[x86_64.set]
CONFIG_LEGACY_VSYSCALL_NONE = "y"
CONFIG_X86_UMIP = "y"
CONFIG_RANDOMIZE_MEMORY = "y"
CONFIG_X86_KERNEL_IBT = "y"
CONFIG_CFI_AUTO_DEFAULT = "y"
CONFIG_INTEL_IOMMU = "y"
CONFIG_INTEL_IOMMU_DEFAULT_ON = "y"
CONFIG_AMD_IOMMU = "y"
CONFIG_ARCH_MMAP_RND_BITS = "32"
CONFIG_X86_INTEL_TSX_MODE_OFF = "y"
CONFIG_MICROCODE = "y"
# T56, S17: every MITIGATION_* option in the pinned tree. A point release
# that adds one fails the check until it is listed here.
CONFIG_MITIGATION_PAGE_TABLE_ISOLATION = "y"
CONFIG_MITIGATION_RETPOLINE = "y"
CONFIG_MITIGATION_RETHUNK = "y"
CONFIG_MITIGATION_UNRET_ENTRY = "y"
CONFIG_MITIGATION_CALL_DEPTH_TRACKING = "y"
CONFIG_MITIGATION_IBPB_ENTRY = "y"
CONFIG_MITIGATION_IBRS_ENTRY = "y"
CONFIG_MITIGATION_SRSO = "y"
CONFIG_MITIGATION_SLS = "y"
CONFIG_MITIGATION_GDS = "y"
CONFIG_MITIGATION_RFDS = "y"
CONFIG_MITIGATION_SPECTRE_BHI = "y"
CONFIG_MITIGATION_MDS = "y"
CONFIG_MITIGATION_TAA = "y"
CONFIG_MITIGATION_MMIO_STALE_DATA = "y"
CONFIG_MITIGATION_L1TF = "y"
CONFIG_MITIGATION_RETBLEED = "y"
CONFIG_MITIGATION_SPECTRE_V1 = "y"
CONFIG_MITIGATION_SPECTRE_V2 = "y"
CONFIG_MITIGATION_SRBDS = "y"
CONFIG_MITIGATION_SSB = "y"
CONFIG_MITIGATION_ITS = "y"
CONFIG_MITIGATION_TSA = "y"

# Options all_listed covers that cannot apply, with the reason. Each must
# stay unset; the check fails if one lands.
[x86_64.not_applicable]
CONFIG_MITIGATION_VMSCAPE = "protects a KVM host from its guests; KVM is off and NineLives is never a host"

[x86_64.upstream_not_applied]

[x86_64.sysctl]
"kernel.perf_event_paranoid" = "2"

[x86_64.cmdline]
required = ["pti=on"]

[aarch64]
unset = [
  "CONFIG_COMPAT",
  "CONFIG_PERF_EVENTS",
  "CONFIG_KASAN",
]

[aarch64.set]
CONFIG_SHADOW_CALL_STACK = "y"
CONFIG_ARM64_PTR_AUTH_KERNEL = "y"
CONFIG_ARM64_BTI_KERNEL = "y"
CONFIG_ARM64_MTE = "y"
CONFIG_ARM64_E0PD = "y"
CONFIG_ARM64_SW_TTBR0_PAN = "y"
CONFIG_UNMAP_KERNEL_AT_EL0 = "y"
CONFIG_MITIGATE_SPECTRE_BRANCH_HISTORY = "y"
CONFIG_ARCH_MMAP_RND_BITS = "33"
CONFIG_ARM64_GCS = "y"

[aarch64.upstream_not_applied]
CONFIG_RANDOMIZE_MEMORY = "x86 only; arm64 randomizes the linear map with RANDOMIZE_BASE"
CONFIG_KASAN_HW_TAGS = "KASAN is off: it costs memory and CPU on every allocation, and it reports a bad access rather than panicking"

[aarch64.sysctl]

[aarch64.cmdline]
required = []
