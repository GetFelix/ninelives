# The production root's package install (docs/components/image.md,
# "Building the root"). mkosi only installs packages and runs Debian's
# maintainer scripts; scripts/image_stage.py then trims and seals the tree.
#
# Set on the command line by scripts/image-build.sh, because they come from
# the pin files: Release=, Packages= (images/packages.toml), SourceDateEpoch=,
# LocalMirror= and the sandbox tree holding the apt sources. The rebuild adds
# a skeleton tree, a sandbox tree and Environment= for libfaketime.

[Distribution]
Distribution=debian

[Output]
Format=directory
ImageId=ninelives

[Content]
Bootable=no
WithDocs=no
WithRecommends=no
# image_stage.py reads dpkg's database before it deletes it.
CleanPackageMetadata=no
RepositoryKeyCheck=yes
PostInstallationScripts=probe-clock.chroot
