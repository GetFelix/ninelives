# Files removed from packages the image keeps, because nothing in the root
# uses them (docs/components/image.md, "Building the root", step 4). Every
# entry says why. A shared library listed here that something still links
# against fails the build: the check resolves every DT_NEEDED inside the root.
# {triplet} is the target's multiarch directory (target.toml).

[[prune]]
path = "/usr/lib/{triplet}/gconv"
reason = "iconv character set modules; Felix, felixd and the init do not call iconv"

[[prune]]
paths = [
  "/usr/lib/{triplet}/libBrokenLocale.so.1",
  "/usr/lib/{triplet}/libanl.so.1",
  "/usr/lib/{triplet}/libc_malloc_debug.so.0",
  "/usr/lib/{triplet}/libmemusage.so",
  "/usr/lib/{triplet}/libmvec.so.1",
  "/usr/lib/{triplet}/libnsl.so.1",
  "/usr/lib/{triplet}/libnss_compat.so.2",
  "/usr/lib/{triplet}/libnss_hesiod.so.2",
  "/usr/lib/{triplet}/libpcprofile.so",
  "/usr/lib/{triplet}/libthread_db.so.1",
  "/usr/lib/{triplet}/libutil.so.1",
]
reason = "debugging, profiling and legacy NSS libraries nothing links against or loads; nsswitch.conf names only files and dns"
