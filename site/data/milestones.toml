# The one file to edit when the status changes. The home page and the roadmap
# both read it. status is one of: done, active, next, planned.
# Mark an issue done = true when it closes. Keep this in step with the GitHub milestones.

[project]
stage = "Design stage"
summary = "Nothing boots yet, and the big choices are still open. The first milestone is next."
updated = "2026-10-30"

[[milestones]]
id = "M0"
number = 1
title = "Boots in a VM"
status = "next"
proves = "The image can be built the same way every time, and CI can boot it. Every later test stands on this."
ends = "An image boots in qemu on x86_64 and aarch64, and CI boots it on every pull request."
issues = [
  { n = 1, title = "Build a qemu image (mkosi is proposed)" },
  { n = 2, title = "CI: build the image and boot it in qemu on every PR" },
  { n = 3, title = "Kernel: pin the first image's kernel (which kernel is open)" },
]

[[milestones]]
id = "M1"
number = 2
title = "Joins a cluster"
status = "planned"
proves = "A machine becomes a cluster member by itself, with Felix and felixd running from the image and no setup by hand."
ends = "Felix and felixd start on the image, and a machine joins a cluster on first boot."
issues = [
  { n = 4, title = "Data partition for state that survives upgrades" },
  { n = 5, title = "First-boot join" },
  { n = 6, title = "Ship Felix and felixd in the image" },
  { n = 15, title = "Design: our own PID 1, or systemd?" },
  { n = 16, title = "Design: how a machine proves its identity on first join" },
]

[[milestones]]
id = "M2"
number = 3
title = "Survives losing a machine"
status = "planned"
proves = "The central claim: kill a machine and its workload carries on elsewhere with nothing lost or repeated."
ends = "Three VMs form a cluster, run a workload, lose one VM, and the workload continues. CI runs this."
issues = [
  { n = 7, title = "Three-VM demo: lose a machine, keep the workload" },
]

[[milestones]]
id = "M3"
number = 4
title = "Atomic upgrades"
status = "planned"
proves = "A machine can be upgraded and rolled back without losing its state, and only signed images run."
ends = "An upgrade switches atomically and falls back on a failed boot. Images are signed. A/B root partitions are the proposal."
issues = [
  { n = 8, title = "A/B root partitions with rollback (proposed)" },
  { n = 9, title = "Signed images and secure boot" },
]

[[milestones]]
id = "M4"
number = 5
title = "System programs on the log"
status = "planned"
proves = "The operating system is made of programs on the log, so its own decisions can be replayed like any other workload's."
ends = "The scheduler, the name service and the fx shell run as programs on the log."
issues = [
  { n = 10, title = "Scheduler as a program on the log" },
  { n = 11, title = "Name service and namespace tree" },
  { n = 12, title = "fx shell" },
]

[[milestones]]
id = "M5"
number = 6
title = "Real hardware and clouds"
status = "planned"
proves = "NineLives runs somewhere other than qemu."
ends = "Cloud images and a Raspberry Pi image."
issues = [
  { n = 13, title = "Cloud images" },
  { n = 14, title = "Raspberry Pi image" },
]

# The big undecided choices, shown on the home page and the roadmap. Remove one when it is decided.
[[questions]]
title = "Linux or our own kernel?"
proposal = "Stock Linux through the three-VM milestone, then look again. Both sides are in the discussion."
link = "https://github.com/GetFelix/ninelives/discussions/22"
label = "Discussion #22"

[[questions]]
title = "Our own PID 1, or systemd?"
proposal = "systemd for the first milestones, then see how much of its job moves onto the log."
link = "https://github.com/GetFelix/ninelives/issues/15"
label = "Issue #15"

[[questions]]
title = "How are images built?"
proposal = "mkosi, producing a read-only root."
link = "https://github.com/GetFelix/ninelives/issues/1"
label = "Issue #1"

[[questions]]
title = "How does a machine upgrade?"
proposal = "A/B root partitions that switch on reboot and fall back on a failed boot."
link = "https://github.com/GetFelix/ninelives/issues/8"
label = "Issue #8"

[[questions]]
title = "How does a machine prove who it is?"
proposal = "A one-time join token for the first join; TPM and cloud identity later."
link = "https://github.com/GetFelix/ninelives/issues/16"
label = "Issue #16"
