# The one file to edit when the status changes. The home page and the roadmap
# both read it. status is one of: done, active, next, planned.
# Mark an issue done = true when it closes. Keep this in step with the GitHub milestones.

[project]
stage = "Design stage"
summary = "Nothing boots yet. The choices for the first three milestones are made, and the first one is next."
updated = "2026-11-18"

[[milestones]]
id = "M0"
number = 1
title = "Boots in a VM"
status = "next"
proves = "The image can be built the same way every time, and CI can boot it. Every later test stands on this."
ends = "An image boots in qemu on x86_64 and aarch64, and CI boots it on every pull request."
issues = [
  { n = 1, title = "Build a qemu image with mkosi" },
  { n = 3, title = "Kernel: pin a version and write the config fragments" },
  { n = 46, title = "init: design document" },
  { n = 47, title = "init: first slice that boots" },
  { n = 2, title = "CI: build the image and boot it in qemu on every PR" },
]

[[milestones]]
id = "M1"
number = 2
title = "Joins a cluster"
status = "planned"
proves = "A machine becomes a cluster member by itself, with Felix and felixd running from the image and no setup by hand."
ends = "Felix and felixd start on the image, and a machine joins a cluster on first boot."
issues = [
  { n = 4, title = "Data partition for state that survives upgrades" },
  { n = 5, title = "First-boot join" },
  { n = 6, title = "Ship Felix and felixd in the image" },
  { n = 48, title = "init: services, cgroups, restart and ordered shutdown" },
  { n = 16, title = "Design: how a machine proves its identity on first join" },
  { n = 49, title = "CI: check that the image stays on standard system calls" },
  { n = 50, title = "Fault injection on a schedule" },
  { n = 51, title = "Test against felixd's main branch nightly" },
  { n = 52, title = "Bump images/components.toml when felixd or Felix releases" },
]

[[milestones]]
id = "M2"
number = 3
title = "Survives losing a machine"
status = "planned"
proves = "The central claim: kill a machine and its workload carries on elsewhere with nothing lost or repeated."
ends = "Three VMs form a cluster, run a workload, lose one VM, and the workload continues. CI runs this."
issues = [
  { n = 7, title = "Three-VM demo: lose a machine, keep the workload" },
  { n = 54, title = "Boot the image's root on Asterinas in CI" },
  { n = 53, title = "Review the kernel decision once M2 passes" },
]

[[milestones]]
id = "M3"
number = 4
title = "Atomic upgrades"
status = "planned"
proves = "A machine can be upgraded and rolled back without losing its state, and only signed images run."
ends = "An upgrade switches atomically and falls back on a failed boot. Images are signed. A/B root partitions are the proposal."
issues = [
  { n = 8, title = "A/B root partitions with rollback (proposed)" },
  { n = 9, title = "Signed images and secure boot" },
]

[[milestones]]
id = "M4"
number = 5
title = "System programs on the log"
status = "planned"
proves = "The operating system is made of programs on the log, so its own decisions can be replayed like any other workload's."
ends = "The scheduler, the name service and the fx shell run as programs on the log."
issues = [
  { n = 10, title = "Scheduler as a program on the log" },
  { n = 11, title = "Name service and namespace tree" },
  { n = 12, title = "fx shell" },
]

[[milestones]]
id = "M5"
number = 6
title = "Real hardware and clouds"
status = "planned"
proves = "NineLives runs somewhere other than qemu."
ends = "Cloud images and a Raspberry Pi image."
issues = [
  { n = 13, title = "Cloud images" },
  { n = 14, title = "Raspberry Pi image" },
]

# The big choices, shown on the home page, the roadmap and the design index.
# Open ones first. When one is decided, set decided = true, put the decision in
# "answer" and link its record in docs/decisions/.
[[questions]]
title = "How does a machine upgrade?"
answer = "A/B root partitions that switch on reboot and fall back on a failed boot."
link = "https://github.com/GetFelix/ninelives/issues/8"
label = "Issue #8"

[[questions]]
title = "How does a machine prove who it is?"
answer = "A one-time join token for the first join; TPM and cloud identity later."
link = "https://github.com/GetFelix/ninelives/issues/16"
label = "Issue #16"

[[questions]]
title = "Linux or our own kernel?"
decided = true
answer = "Upstream Linux built from source with our own hardened, network-tuned config, through the three-VM milestone, then reviewed with an Asterinas experiment in hand."
link = "https://github.com/GetFelix/ninelives/blob/main/docs/decisions/0001-linux-kernel.md"
label = "Decision 0001"

[[questions]]
title = "Our own PID 1, or systemd?"
decided = true
answer = "Our own small init in Rust: it mounts, reaps, starts and restarts the role's services, and shuts down in order so a clean reboot leaves Felix nothing to repair."
link = "https://github.com/GetFelix/ninelives/blob/main/docs/decisions/0002-our-own-init.md"
label = "Decision 0002"

[[questions]]
title = "How are images built?"
decided = true
answer = "mkosi, in CI, built twice and compared. Felix and felixd come from pinned releases, checked by hash and signature."
link = "https://github.com/GetFelix/ninelives/blob/main/docs/decisions/0003-mkosi-image-build.md"
label = "Decision 0003"

[[questions]]
title = "Which distribution is the root built from?"
decided = true
answer = "A minimal Debian 13, about a dozen packages pinned to a snapshot, under a kernel we build from upstream source."
link = "https://github.com/GetFelix/ninelives/blob/main/docs/decisions/0006-debian-base.md"
label = "Decision 0006"
