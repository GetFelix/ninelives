<svg xmlns="http://www.w3.org/2000/svg" class="nl-ill" viewBox="0 0 720 480" width="720" height="480"><style>.nl-ill{--f-ink:#0e2a3a;--f-soft:rgba(95,211,239,.22);--f-cat:#0e2a3a;--f-eye:#5fd3ef;--f-label:#46536a;--f-amber-text:#8f4c00}
