{% set q = load_data(path="data/milestones.toml") -%}
<ul class="questions">
  {%- for item in q.questions %}
  <li class="reveal" style="--d:{{ loop.index0 }}">
    <a href="{{ item.link }}">
      <span class="q-mark" aria-hidden="true">?</span>
      <b>{{ item.title }}</b>
      <span class="q-prop"><em>Proposal.</em> {{ item.proposal }}</span>
      <span class="q-link">{{ item.label }}</span>
    </a>
  </li>
  {%- endfor %}
</ul>
